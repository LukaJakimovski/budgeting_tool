# Run Gradle's build daemon on JDK 21 regardless of the system default JDK.
# (Capacitor 8 / Android Gradle Plugin 8.x target JDK 21; very new JDKs such as
# 26/27 can't compile the build scripts.) Gradle picks up an installed JDK 21
# automatically, e.g. Arch/CachyOS: sudo pacman -S jdk21-openjdk
toolchainVersion=21
