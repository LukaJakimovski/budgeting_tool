name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
        working-directory: app
      - name: Type-check
        run: npm run check
        working-directory: app
      - name: Unit tests (app)
        run: npm test
        working-directory: app
      - name: Unit tests (server)
        run: npm test
        working-directory: server
      - name: Build web app
        run: npm run build
        working-directory: app
      - name: End-to-end tests
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results

  android:
    # Builds the debug APK with the same helper script people use locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        run: app/android/build-apk.sh
